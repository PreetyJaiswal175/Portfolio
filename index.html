<style>
:root{--bg:#f7f9fe;--ink:#14203f;--mute:#59647f;--line:rgba(20,32,63,.12);--glass:rgba(255,255,255,.7);--edge:rgba(255,255,255,.95);--sky:#8fc7ff;--lilac:#b9a8ff;--mint:#a4ead3;--accent:#3a63e8;--shadow:rgba(58,99,232,.14);--r:30px}

html{scroll-behavior:smooth;scroll-padding-top:100px}
body{font:400 17px/1.65 Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 90% 4%,rgba(143,199,255,.35),transparent 70%),radial-gradient(800px 600px at 0 50%,rgba(164,234,211,.28),transparent 70%),var(--bg);overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.05;letter-spacing:-.03em}
a{color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
svg.defs{position:absolute;width:0;height:0}
.drip{position:fixed;inset:0 0 auto 0;height:210px;pointer-events:none;z-index:0;filter:url(#goo)}
.drip .bar{position:absolute;top:-30px;left:-5%;width:110%;height:46px;background:linear-gradient(90deg,var(--sky),var(--lilac),var(--mint),var(--sky))}
.drip i{position:absolute;top:0;width:24px;height:24px;border-radius:50%;background:var(--sky);animation:fall 7s cubic-bezier(.55,0,.8,.6) infinite}
.drip i:nth-child(odd){background:var(--lilac)}.drip i:nth-child(3n){background:var(--mint)}
@keyframes fall{0%{transform:translateY(0) scale(.6,1)}35%{transform:translateY(22px) scale(.9,1.5)}80%{transform:translateY(170px) scale(.7,1.2)}100%{transform:translateY(195px) scale(.3);opacity:0}}
nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--edge);box-shadow:0 10px 40px var(--shadow)}
nav a{position:relative;z-index:1;text-decoration:none;font-weight:600;font-size:15px;padding:9px 19px;border-radius:999px;color:var(--mute);transition:color .3s}
nav a.on{color:var(--ink)}
#pill{position:absolute;top:6px;bottom:6px;left:0;width:60px;border-radius:999px;background:linear-gradient(120deg,var(--sky),var(--lilac));transition:left .6s cubic-bezier(.34,1.56,.64,1),width .6s cubic-bezier(.34,1.56,.64,1)}
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 28px}
.page{animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;filter:blur(8px);transform:translateY(14px)}}
section{padding:110px 0 0}
h2{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:14px}
.sub{color:var(--mute);max-width:54ch;margin-bottom:40px}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);border-radius:var(--r);box-shadow:0 18px 50px var(--shadow)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 25px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--glass);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 30px var(--shadow)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:5px 13px;border-radius:999px;background:rgba(143,199,255,.26);font-size:13.5px;font-weight:500}
/* hero */
.hero{min-height:100vh;padding-top:150px;position:relative;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(3.4rem,10vw,8rem);font-weight:700;margin-bottom:26px}
.hero p.lead{font-size:clamp(1.1rem,2vw,1.3rem);color:var(--mute);max-width:40ch;margin-bottom:34px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);margin-top:64px;padding:22px 8px}
.strip div{padding:6px 26px;border-left:1px solid var(--line)}.strip div:first-child{border:0}
.strip b{display:block;font:600 1.05rem 'Bricolage Grotesque',sans-serif}.strip span{color:var(--mute);font-size:15px}

.res .txt{padding:46px;max-width:760px}.res h3{font-size:clamp(1.7rem,3vw,2.4rem);margin:14px 0 16px}.res p{color:var(--mute);margin-bottom:22px}
.lab{display:inline-block;padding:5px 14px;border-radius:999px;background:linear-gradient(120deg,var(--sky),var(--lilac));font-size:13.5px;font-weight:600}
/* projects */
.pr{display:grid;grid-template-columns:1fr auto;gap:6px 30px;align-items:center;position:relative;overflow:hidden;isolation:isolate;text-decoration:none;padding:32px 36px;margin-bottom:16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);box-shadow:0 10px 36px var(--shadow)}
.pr:before{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(110deg,rgba(143,199,255,.5),rgba(185,168,255,.45));border-radius:42%;transform:translateX(-105%);transition:transform .9s cubic-bezier(.2,.8,.2,1);z-index:-1}
.pr:hover:before{transform:translateX(0) rotate(6deg)}
.pr h3{font-size:clamp(1.5rem,3vw,2.2rem)}.pr .k{color:var(--accent);font-weight:600;font-size:15px}.pr p{color:var(--mute);max-width:56ch;margin:6px 0 12px;grid-column:1}.pr .tags{grid-column:1}
.pr .m{grid-column:2;grid-row:1/4;text-align:right}.pr .m b{display:block;font:700 1.6rem 'Bricolage Grotesque',sans-serif}.pr .m small{color:var(--mute);font-size:14px}
.pr .go{display:inline-grid;place-items:center;width:44px;height:44px;margin-top:12px;border-radius:50%;background:var(--ink);color:#fff;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}.pr:hover .go{transform:rotate(-45deg) scale(1.1)}
/* education */
.ed{display:grid;grid-template-columns:200px 1fr;gap:6px 30px;padding:26px 0;border-top:1px solid var(--line)}
.ed:last-child{border-bottom:1px solid var(--line)}.ed small{font-weight:600;color:var(--accent);padding-top:6px}.ed h3{font-size:1.5rem}.ed p{color:var(--mute)}
/* toolbox */
.mq{overflow:hidden;margin:0 -28px;padding:4px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq div{display:flex;gap:12px;width:max-content;margin-bottom:14px;animation:mq 50s linear infinite}.mq div:nth-child(2){animation-direction:reverse;animation-duration:60s}.mq:hover div{animation-play-state:paused}
.mq span{padding:11px 24px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-weight:500;box-shadow:0 6px 20px var(--shadow);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.contact{text-align:center;padding-bottom:60px}.contact .sub{margin:0 auto 26px}
.contact a.big{display:inline-block;font:700 clamp(1.4rem,5vw,3.2rem)/1.2 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;text-decoration:none;word-break:break-all;margin-bottom:30px}.contact a.big:hover{color:var(--accent)}.contact .btns{justify-content:center}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:14px;padding:10px 0 30px}
/* detail */
.doc{padding-top:150px;padding-bottom:60px;min-height:80vh}
.back{display:inline-block;margin-bottom:26px;color:var(--mute);text-decoration:none;font-weight:500}.back:hover{color:var(--ink)}
.doc h1{font-size:clamp(2.3rem,5.5vw,4rem);margin-bottom:10px;max-width:20ch}.doc .meta{color:var(--mute);margin-bottom:38px}
.doc h3{font-size:1.35rem;margin:34px 0 10px}.doc p,.doc li{max-width:64ch;margin-bottom:12px}.doc ul{padding-left:20px}
.note{display:inline-flex;gap:10px;align-items:center;padding:10px 18px;border-radius:999px;background:rgba(185,168,255,.28);font-size:15px;font-weight:500;margin-bottom:30px}
.note:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--lilac);animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.7);opacity:.4}}
@media(max-width:820px){nav{top:14px;width:calc(100% - 20px);left:10px;transform:none}nav a{flex:1;text-align:center;padding:9px 0;font-size:13px}.res .txt{padding:30px}.strip{grid-template-columns:1fr}.strip div{border:0;padding:10px 20px}.pr{grid-template-columns:1fr;padding:26px}.pr .m{grid-column:1;grid-row:auto;text-align:left}.ed{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const P=[
{id:'researchmind',t:'ResearchMind',kind:'Multi-agent deep research',d:'May 2026',one:'AI agents that search, read, write and critique a research report, then fix it if it falls short.',m:'Self-correcting',tags:['LangGraph','asyncio','LLMs'],
 what:['Takes a question, searches the web from several angles, reads sources in parallel and writes a structured report.','A critic agent scores the draft and sends weak reports back for automatic self-correction.'],
 how:['Multi-agent workflow built with LangGraph and LangChain.','Concurrent retrieval with asyncio and aiohttp, plus TTL caching to cut repeat API calls.','Fallback routing across Gemini and OpenAI models keeps runs reliable when one model fails.'],
 stack:['Python','LangGraph','LangChain','asyncio','Gemini','OpenAI'],gh:'AI-deep-research-agent'},
{id:'wildfire',t:'Pan-India Forest Fire Warning',kind:'Spatio-temporal risk prediction',d:'Feb – Apr 2026',one:'Monthly fire-risk forecasts across India at about 11 km resolution, with the drivers explained.',m:'0.958 ROC-AUC',tags:['ConvLSTM','XGBoost','SHAP'],
 what:['Predicts where forest fires are most likely in the coming month.','Course project (KSS604) on spatio-temporal risk modelling.'],
 how:['Fused 13 years of ERA5 weather, NDVI vegetation and VIIRS fire observations with lag, climatology and environmental features.','Compared ConvLSTM2D, FT-Transformer, XGBoost and Random Forest on 2022–2024 out-of-time data.','Best model reached 0.958 ROC-AUC, with calibrated probabilities and SHAP analysis of the main drivers.'],
 stack:['Python','ConvLSTM','XGBoost','SHAP','ERA5','GeoPandas'],gh:'Fire-Prediction'},
{id:'movies',t:'Hybrid Movie Recommender',kind:'Semantic recommendation engine',d:'Jan 2026',one:'Recommends films by meaning, ranked with popularity and review sentiment, in a Streamlit app.',m:'55K+ films',tags:['Embeddings','NLP','Streamlit'],
 what:['Suggests films by meaning, then ranks them with popularity and review sentiment.','Served through a Streamlit app.'],
 how:['Sentence-Transformers encode 55,000+ films into 384-dimensional embeddings.','Cosine similarity is blended with Bayesian popularity scoring for the final ranking.','Benchmarked with Precision@K, NDCG@K and MRR against a CountVectorizer baseline.'],
 stack:['Python','Sentence-Transformers','Streamlit','scikit-learn'],gh:'AI-Movie-Recommendation'},
{id:'cyclone',t:'Cyclone Track Prediction',kind:'Multi-horizon trajectory forecasting',d:'Sept – Nov 2025',one:'Predicts where a cyclone will be 6 to 72 hours ahead, using physics-aware features and 7 models.',m:'11.09 km @ 6h',tags:['Ensembles','Feature engineering','IBTrACS'],
 what:['Multi-horizon track forecasting from historical storm records.','Course project (EE708).'],
 how:['Built from 45+ years of NOAA IBTrACS data with 149 engineered meteorological, kinematic and geospatial features.','Seven models compared on a leakage-free chronological split (train 1980–2019, test 2020–2025).','Reached 11.09 km error at 6 hours and 26.30 km at 12 hours, about 40% better than a Ridge baseline.'],
 stack:['Python','scikit-learn','XGBoost','LightGBM','Feature engineering'],gh:'Cyclone_Track_Prediction'}];
const E=[['2025 – Present','M.Tech, AI for Sustainability','Indian Institute of Technology, Kanpur'],['2023 – 2025','M.Sc, Statistics','University of Allahabad, Prayagraj'],['2020 – 2023','B.Sc, Statistics','University of Allahabad, Prayagraj'],['2020','Class XII, CBSE','St. Paul Public School, U.P.'],['2018','Class X, UP Board','Prestige Inter College, U.P.']];
const K=['Python','PyTorch','TensorFlow','scikit-learn','XGBoost','LightGBM','LangGraph','LangChain','RAG','Transformers','ConvLSTM','GeoPandas','Time-series','SQL','R','Docker','Streamlit','Linux'];
const S=[['Languages',['Python','SQL','R','PyTorch','TensorFlow','Scikit-Learn','XGBoost','LightGBM','CNN','RNN','LSTM','Transformers']],['Data & Agents',['NumPy','Pandas','GeoPandas','Matplotlib','Seaborn','Feature Engineering','Time-Series Modeling','LangChain','LangGraph','RAG','Sentence-Transformers','LLM Fine-Tuning']],['Tools & Coursework',['Streamlit','Docker','GitHub','Linux','LaTeX','Jupyter','Regression Analysis','Multivariate Analysis','Stochastic Processes','Estimation Theory','Statistical Computing','Data Mining']]];
const chips=a=>`<div class="tags">${a.map(x=>`<span>${x}</span>`).join('')}</div>`;
const back=`<a class="back" href="#projects">← Back</a>`;
const HOME=()=>`<section id="home" class="hero"><h1>Preety<br>Jaiswal</h1><p class="lead">I build machine-learning systems and LLM-powered agents on a foundation in statistics, with a growing interest in generative AI, forecasting and data science.</p>
<div class="btns"><a class="btn pri" href="#projects">View projects</a><a class="btn" href="#research">Thesis overview</a><a class="btn" href="assets/Preety_Jaiswal_Resume.pdf" target="_blank" rel="noopener">Résumé</a></div>
<div class="glass strip"><div><b>IIT Kanpur</b><span>M.Tech, AI for Sustainability</span></div><div><b>Thesis</b><span>India’s warming puzzle</span></div><div><b>Background</b><span>Statistics, University of Allahabad</span></div></div></section>
<section id="research"><h2>Research</h2><p class="sub">An unpublished thesis, shared here as an overview.</p>
<div class="glass res"><div class="txt"><span class="lab">M.Tech thesis · Ongoing</span><h3>Why does India warm about half as fast as the world?</h3><p>India’s long-term warming is weaker than the global average, even with severe summer heatwaves. I look at whether warming differs between rainy and non-rainy days, and how sunlight, clouds and outgoing heat help explain it.</p><a class="btn pri" href="#research-overview">Read the overview</a></div>
</div></section>
<section id="projects"><h2>Projects</h2><p class="sub">Selected work. Open any project for the details.</p>${P.map(p=>`<a class="pr" href="#project-${p.id}"><div><span class="k">${p.kind} · ${p.d}</span><h3>${p.t}</h3></div><div class="m"><b>${p.m}</b></div><p>${p.one}</p>${chips(p.tags)}<span class="go">→</span></a>`).join('')}</section>
<section id="education"><h2>Education</h2><p class="sub">From statistics to AI for sustainability.</p>${E.map(e=>`<div class="ed"><small>${e[0]}</small><div><h3>${e[1]}</h3><p>${e[2]}</p></div></div>`).join('')}</section>
<section id="toolbox"><h2>Toolbox</h2><p class="sub">Languages, libraries and the statistics behind them.</p><div class="mq">${S.map(r=>{const h=r[1].map(x=>`<span>${x}</span>`).join('');return `<div>${h}${h}</div>`}).join('')}</div></section>
<section id="contact" class="contact"><h2>Get in touch</h2><p class="sub">Happy to talk about research, projects or ideas.</p><a class="big" href="mailto:preetyjaiswal0470@gmail.com">preetyjaiswal0470@gmail.com</a>
<div class="btns"><a class="btn pri" href="https://www.linkedin.com/in/preety-jaiswal-72a6a9235" target="_blank" rel="noopener">LinkedIn ↗</a><a class="btn" href="https://github.com/PreetyJaiswal175" target="_blank" rel="noopener">GitHub ↗</a><a class="btn" href="assets/Preety_Jaiswal_Resume.pdf" target="_blank" rel="noopener">Download résumé</a></div></section>`;
const RES=()=>`<div class="doc"><a class="back" href="#research">← Back</a><h1>Why is India’s warming about half the global average?</h1><p class="meta">M.Tech thesis, ongoing · Supervisor: Dr. Sarosh Alam Ghausi</p><div class="note">Unpublished work, shared here as an overview only</div>
<h3>The puzzle</h3><p>The world is warming, and 2024 was the warmest year on record both globally and in India. Yet India’s long-term warming rate appears to be only about half the global average, even though the country regularly endures severe summer heatwaves. My thesis asks what is holding India’s average back.</p>
<h3>The idea</h3><p>Warming may not be the same on every kind of day. I separate rainy days from non-rainy days and ask which carries most of the long-term change. I then follow the energy: sunlight reaching the ground, heat radiated back out, and the role of clouds in between.</p>
<h3>The approach</h3><ul><li>Long records of gridded temperature and rainfall, compared with global reanalysis and satellite radiation data.</li><li>Day-by-day anomaly analysis and trend statistics, repeated across regions and seasons.</li><li>A physics-guided view of the surface energy budget, linking radiation to surface temperature.</li></ul>
<h3>Why it matters</h3><p>Understanding why a region warms the way it does is the first step to projecting its future climate, and to planning for heat, water and agriculture.</p></div>`;
const PRJ=p=>`<div class="doc">${back}<h1>${p.t}</h1><p class="meta">${p.kind} · ${p.d}</p><h3>What it does</h3>${p.what.map(x=>`<p>${x}</p>`).join('')}<h3>How it’s built</h3><ul>${p.how.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Tools</h3>${chips(p.stack)}<p style="margin-top:28px"><a class="btn pri" href="https://github.com/PreetyJaiswal175/${p.gh}" target="_blank" rel="noopener">View on GitHub ↗</a></p></div>`;
const app=document.getElementById('app'),pill=document.getElementById('pill'),links=[...document.querySelectorAll('nav a')];
let spy,cur='home';
function movePill(){const a=links.find(l=>l.getAttribute('href')==='#'+cur);if(!a){pill.style.opacity=0;return}pill.style.opacity=1;pill.style.left=a.offsetLeft+'px';pill.style.width=a.offsetWidth+'px'}
function setCur(id){cur=id==='toolbox'?'education':id;links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+cur));movePill()}
function mount(html,key){if(app.dataset.v!==key){app.dataset.v=key;app.innerHTML=`<div class="page">${html}</div>`;if(spy)spy.disconnect();spy=null;return true}return false}
function route(){const h=location.hash.slice(1)||'home';let d=null;
 if(h==='research-overview')d=RES();else if(h.startsWith('project-')){const p=P.find(x=>'project-'+x.id===h);if(p)d=PRJ(p)}
 if(d){mount(d,h);scrollTo(0,0);setCur(h==='research-overview'?'research':'projects');return}
 const fresh=mount(HOME(),'home');if(fresh){watch()}
 const el=document.getElementById(h)||document.getElementById('home');setTimeout(()=>el.scrollIntoView(),fresh?30:0);setCur(el.id)}
function watch(){spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setCur(e.target.id)}),{rootMargin:'-40% 0px -55% 0px'});document.querySelectorAll('main section').forEach(s=>spy.observe(s))}
addEventListener('hashchange',route);addEventListener('resize',movePill);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{route();movePill()});route();
</script>
